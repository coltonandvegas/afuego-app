<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#100d0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="A Fuego ERP" />
  <title>A Fuego ERP</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=331" />
</head>
<body>
  <div id="app"><div class="boot"><div class="brand-flame">🔥</div><div>A FUEGO ERP</div><small>Lighting the grill...</small></div></div>
  <script>
    (() => {
      const app = document.getElementById('app');
      const escapeHtml = value => String(value ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      const showError = (title, detail) => {
        if (window.__AFUEGO_ERROR_SHOWN__) return;
        window.__AFUEGO_ERROR_SHOWN__ = true;
        window.__AFUEGO_READY__ = true;
        app.innerHTML = `<div class="boot"><div class="brand-flame">⚠️</div><div>${escapeHtml(title)}</div><small style="opacity:.6">Build 3.3.1</small><small style="max-width:680px;white-space:normal">${escapeHtml(detail || 'Unknown error')}</small><button class="btn btn-primary" style="margin-top:16px" onclick="location.reload()">Retry</button></div>`;
      };
      const loadScript = src => new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.defer = true;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Could not download ${src}`));
        document.head.appendChild(script);
      });

      // Fix for printable A4 windows:
      // the ERP creates a blank local window, writes the printable HTML into it,
      // then opens the browser print dialog. Chromium may return an unusable
      // reference when noopener/noreferrer are requested for that blank window.
      const nativeOpen = window.open.bind(window);
      window.open = (url = '', target = '_blank', features = '') => {
        const isLocalBlankPrintWindow =
          (url === '' || url === 'about:blank') && target === '_blank';

        if (isLocalBlankPrintWindow) {
          const cleanedFeatures = String(features)
            .split(',')
            .map(x => x.trim())
            .filter(x => x && !/^(noopener|noreferrer)$/i.test(x))
            .join(',');
          return nativeOpen(url, target, cleanedFeatures);
        }
        return nativeOpen(url, target, features);
      };

      if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rows => Promise.all(rows.map(r => r.unregister()))).catch(() => {});
      if ('caches' in window) caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).catch(() => {});

      window.addEventListener('error', event => {
        if (!window.__AFUEGO_READY__) showError("COULDN'T START THE APP", event.message || event.error);
      });
      window.addEventListener('unhandledrejection', event => {
        if (!window.__AFUEGO_READY__) showError('CLOUD CONNECTION FAILED', event.reason?.message || event.reason);
      });

      (async () => {
        try {
          try {
            await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.5');
          } catch (primaryError) {
            await loadScript('https://unpkg.com/@supabase/supabase-js@2.110.5');
          }
          if (!window.supabase?.createClient) throw new Error('Supabase loaded without createClient.');
          await loadScript('./app.bundle.js?v=331');
        } catch (error) {
          showError("COULDN'T LOAD THE APPLICATION", error?.message || error);
        }
      })();

      setTimeout(() => {
        if (!window.__AFUEGO_READY__) showError('CLOUD SYNC TIMED OUT', 'The files loaded, but the app did not finish connecting within 30 seconds.');
      }, 30000);
    })();
  </script>
</body>
</html>
